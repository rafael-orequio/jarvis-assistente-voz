<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="700" height="330" fill="#0b1230"/><text x="350" y="36" text-anchor="middle" fill="#7fe4ff" font-size="17" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Whisper (small): tempo para transcrever uma frase</text><text x="30" y="102" fill="#d8ecff" font-size="13" font-family="Segoe UI, Arial, sans-serif">CPU (i5-13450HX)</text><rect x="250" y="80" width="341" height="32" rx="5" fill="#ffb454"/><text x="601" y="102" fill="#d8ecff" font-size="14" font-weight="700" font-family="Segoe UI, Arial, sans-serif">3,1 s</text><text x="30" y="164" fill="#d8ecff" font-size="13" font-family="Segoe UI, Arial, sans-serif">GPU (RTX 3050) — 1ª frase</text><rect x="250" y="142" width="187" height="32" rx="5" fill="#5aa9ff"/><text x="447" y="164" fill="#d8ecff" font-size="14" font-weight="700" font-family="Segoe UI, Arial, sans-serif">1,7 s</text><text x="30" y="226" fill="#d8ecff" font-size="13" font-family="Segoe UI, Arial, sans-serif">GPU (RTX 3050) — demais</text><rect x="250" y="204" width="44" height="32" rx="5" fill="#3ddc97"/><text x="304" y="226" fill="#d8ecff" font-size="14" font-weight="700" font-family="Segoe UI, Arial, sans-serif">0,4 s</text><line x1="250" y1="70" x2="250" y2="258" stroke="#9fb8e8" stroke-width="1"/><text x="350" y="292" text-anchor="middle" fill="#9fb8e8" font-size="11" font-family="Segoe UI, Arial, sans-serif">Medido no notebook do autor, com frases de 3 a 6 segundos de fala. Valores aproximados (médias dos logs).</text><text x="350" y="310" text-anchor="middle" fill="#9fb8e8" font-size="11" font-family="Segoe UI, Arial, sans-serif">Menor é melhor. A primeira frase da GPU inclui o aquecimento do modelo.</text></svg>